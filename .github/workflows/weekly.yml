name: 每周更新选基数据
on:
  schedule:
    - cron: "0 9 * * 5"   # UTC 09:00 = 北京时间周五 17:00
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓数
        id: fetch
        run: WORKERS=12 python scripts/fetch.py
      - name: 换手率（2025年报，已缓存的不重抓）
        id: turnover
        if: steps.fetch.outcome == 'success'
        run: sudo apt-get install -y poppler-utils && python scripts/turnover.py
      - name: 筛选打分
        id: build
        if: steps.fetch.outcome == 'success' && steps.turnover.outcome == 'success'
        run: python scripts/build.py
      - name: 失败则只标记数据过期
        if: steps.fetch.outcome == 'failure' || steps.turnover.outcome == 'failure' || steps.build.outcome == 'failure'
        run: python scripts/mark_stale.py
      - name: 提交
        if: always() && (steps.build.outcome == 'success' || steps.fetch.outcome == 'failure' || steps.turnover.outcome == 'failure' || steps.build.outcome == 'failure')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/official.json data/turnover.json data/history.json
          if git diff --cached --quiet; then echo "无变化"; else git commit -m "data: $(TZ=Asia/Shanghai date '+%F %H:%M') 更新" && git push; fi
